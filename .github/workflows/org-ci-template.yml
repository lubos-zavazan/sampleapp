name: Build and Call reusable workflow TEMPLATE

on:
  push:
    branches: [ "main" ] 
  pull_request:
    branches: [ "main" ] 

jobs:
  build-job:
    runs-on: windows-latest

    steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build code
        run: dotnet build --configuration Release

      - name: Publish code
        run: dotnet publish -c Release --property:PublishDir="${{env.DOTNET_ROOT}}\myapp"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact name
          name: .net-app
          path: ${{env.DOTNET_ROOT}}\myapp

  call-reusable-deployment-workflow-job:
    needs: build-job

    uses: lubos-zavazan/shared-workflows/.github/workflows/reusable-deploy-shared-repo.yml.yml@main
    with:
      package-name: .net-app
      app-name: sampleappgh
      deployment-slot: production
    secrets:
      azure-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}


    
